{% extends "base.html" %}

{% block conteudo %}

<section class="card">
    <h2>Entrar no RunTracker</h2>
    <p>Acesse sua conta para registrar treinos e acompanhar sua evolução.</p>

    <form method="POST">
        <label for="email">E-mail: *</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" requeired>

        <label for="senha">Senha: *</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" requeired>

        <button type="submit">Entrar</button>
    </form>

    <p class="form-footer">
        Ainda não tem conta?
        <a href="{{ url_for('cadastro') }}">Criar cadastro</a>
    </p>
</section>

{% endblock %}
